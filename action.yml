name: L2TP/IPsec VPN
description: Connect a Linux GitHub Actions runner to an L2TP/IPsec VPN without modifying persistent VPN configuration

inputs:
  host:
    description: L2TP/IPsec server IPv4 address or hostname that resolves to IPv4
    required: true
  psk:
    description: IPsec pre-shared key
    required: true
  username:
    description: PPP username
    required: true
  password:
    description: PPP password
    required: true
  routes:
    description: Comma or newline separated IPv4 CIDRs to route through the VPN
    required: false
    default: ""
  timeout:
    description: Maximum seconds for the complete VPN connection sequence
    required: false
    default: "60"

outputs:
  interface:
    description: PPP interface used by the established VPN
  local-ip:
    description: Local IPv4 address assigned to the PPP interface
  peer-ip:
    description: Peer IPv4 address reported by PPP when available

runs:
  using: node24
  main: src/main.js
  post: src/post.js
  post-if: always()

branding:
  icon: shield
  color: blue
